<svg xmlns="http://www.w3.org/2000/svg" width="500" height="216" viewBox="0 0 500 216" role="img" aria-labelledby="title desc">
  <title id="title">Agents: Key Components</title>
  <desc id="desc">Planning and reasoning and memory feed an LLM core, which calls tools and produces agent actions. The agent observes and acts on an external environment.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#252a27">
    <rect x="8" y="8" width="180" height="40" rx="6" fill="#d7ebfa"/>
    <text x="98" y="28" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="650">Planning &amp; Reasoning</text>

    <rect x="196" y="8" width="112" height="40" rx="6" fill="#d9f0c4"/>
    <text x="252" y="28" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="650">Memory</text>

    <rect x="8" y="60" width="300" height="40" rx="6" fill="#f6e4d4"/>
    <text x="158" y="80" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="650">LLM Core</text>

    <rect x="8" y="112" width="300" height="50" rx="6" fill="#d4f0fb"/>
    <text x="158" y="130" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="650">Tools</text>
    <text x="158" y="148" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#687068">Retrieval, code, search, files</text>

    <rect x="8" y="174" width="300" height="34" rx="6" fill="#e5d8f3"/>
    <text x="158" y="191" text-anchor="middle" dominant-baseline="central" font-size="12">
      <tspan font-weight="650">Actions</tspan><tspan fill="#687068"> · tool call, response</tspan>
    </text>

    <rect x="376" y="8" width="116" height="200" rx="12" fill="#f8e0e6"/>
    <text x="434" y="42" text-anchor="middle" font-size="13" font-weight="650">Environment</text>
    <text x="434" y="60" text-anchor="middle" font-size="11" fill="#687068">(external world)</text>
    <text x="434" y="96" text-anchor="middle" font-size="11" fill="#3d4a44">
      <tspan x="434" dy="0">Desktop OS</tspan>
      <tspan x="434" dy="18">Web browser</tspan>
      <tspan x="434" dy="18">Mobile apps</tspan>
      <tspan x="434" dy="18">Databases</tspan>
    </text>
  </g>
  <g fill="#252a27" stroke="#252a27" stroke-width="1.5" stroke-linecap="round">
    <line x1="98" y1="48" x2="98" y2="54" fill="none"/>
    <polygon points="93,54 103,54 98,60" stroke="none"/>
    <line x1="252" y1="48" x2="252" y2="54" fill="none"/>
    <polygon points="247,54 257,54 252,60" stroke="none"/>
    <line x1="158" y1="100" x2="158" y2="106" fill="none"/>
    <polygon points="153,106 163,106 158,112" stroke="none"/>
    <line x1="158" y1="162" x2="158" y2="168" fill="none"/>
    <polygon points="153,168 163,168 158,174" stroke="none"/>

    <line x1="368" y1="80" x2="324" y2="80" fill="none"/>
    <polygon points="324,75 324,85 312,80" stroke="none"/>
    <line x1="308" y1="191" x2="352" y2="191" fill="none"/>
    <polygon points="352,186 352,196 364,191" stroke="none"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#687068" font-size="11">
    <text x="346" y="72" text-anchor="middle">observe</text>
    <text x="336" y="184" text-anchor="middle">act</text>
  </g>
</svg>
